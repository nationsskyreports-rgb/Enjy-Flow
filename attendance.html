<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Align by Enjy — رصيدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0D1F18; --bg2: #112219; --card: #162B1F;
  --border: rgba(255,255,255,0.08);
  --primary: #3D8C6A; --primary-light: #4EAD84;
  --accent: #C8956C; --accent-light: #E0B892;
  --green: #4CAF7D; --red: #E05A5A; --yellow: #F0B429; --blue: #5B8FF9;
  --text: #EEE8DF; --text-muted: #7A9485; --text-faint: #3D5A4A;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 16px 40px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(61,140,106,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.wrap { max-width: 440px; margin: 0 auto; }

/* Header */
.header {
  text-align: center;
  padding: 28px 0 20px;
  animation: fadeUp .5s ease both;
}
.logo-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: #fff;
  margin: 0 auto 12px;
  box-shadow: 0 8px 24px rgba(61,140,106,0.25);
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 3px;
}
.header p { font-size: .78rem; color: var(--text-muted); }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 16px;
}

/* Welcome card */
.welcome-card {
  background: linear-gradient(135deg, var(--primary) 0%, #2A6B4F 100%);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  animation: fadeUp .5s .1s ease both;
}
.welcome-card::before {
  content: '';
  position: absolute;
  top: -40px; left: -40px;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}
.wc-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.wc-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; font-weight: 800; color: #fff;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.2);
}
.wc-name { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
.wc-phone { font-size: .78rem; color: rgba(255,255,255,0.65); }
.wc-class {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.12);
  border-radius: 50px;
  padding: 4px 12px;
  font-size: .72rem;
  color: rgba(255,255,255,0.85);
  border: 1px solid rgba(255,255,255,0.15);
}

/* Credits big display */
.credits-hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: fadeUp .5s .15s ease both;
}
.ch-left {}
.ch-label { font-size: .75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; letter-spacing: .5px; }
.ch-num {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  font-weight: 800;
  line-height: 1;
}
.ch-num.good { color: var(--primary-light); }
.ch-num.warn { color: var(--yellow); }
.ch-num.danger { color: var(--red); }
.ch-sublabel { font-size: .75rem; color: var(--text-muted); margin-top: 4px; }
.ch-right { text-align: center; }
.ch-circle {
  width: 70px; height: 70px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  font-size: 1.3rem;
}
.ch-circle.good { background: rgba(76,175,125,0.12); color: var(--green); }
.ch-circle.warn { background: rgba(240,180,41,0.12); color: var(--yellow); }
.ch-circle.danger { background: rgba(224,90,90,0.12); color: var(--red); }

/* Info cards */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
  animation: fadeUp .5s .2s ease both;
}
.info-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 14px;
}
.ic-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem;
  margin-bottom: 10px;
}
.ic-label { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }
.ic-val { font-size: .95rem; font-weight: 800; color: var(--text); }
.ic-val.warn { color: var(--yellow); }
.ic-val.danger { color: var(--red); }
.ic-val.good { color: var(--green); }

/* Expiry warning */
.expiry-warning {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 16px;
  font-size: .82rem;
  animation: fadeUp .5s .25s ease both;
}
.expiry-warning.warn {
  background: rgba(240,180,41,0.08);
  border: 1px solid rgba(240,180,41,0.2);
  color: var(--yellow);
}
.expiry-warning.danger {
  background: rgba(224,90,90,0.08);
  border: 1px solid rgba(224,90,90,0.2);
  color: var(--red);
}
.expiry-warning i { margin-top: 2px; flex-shrink: 0; }

/* Attendance history */
.history-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeUp .5s .3s ease both;
}
.hc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.hc-head h3 { font-family: 'Cairo', sans-serif; font-size: .92rem; font-weight: 800; }
.hc-badge {
  background: rgba(61,140,106,0.15);
  color: var(--primary-light);
  padding: 3px 10px;
  border-radius: 50px;
  font-size: .72rem;
  font-weight: 700;
}
.attend-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.attend-row:last-child { border-bottom: none; }
.ar-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}
.ar-info { flex: 1; }
.ar-class { font-size: .82rem; font-weight: 700; color: var(--text); }
.ar-date { font-size: .72rem; color: var(--text-muted); margin-top: 1px; }
.ar-time {
  font-size: .75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.empty-history {
  text-align: center;
  padding: 24px;
  color: var(--text-faint);
  font-size: .82rem;
}
.empty-history i { font-size: 1.8rem; display: block; margin-bottom: 8px; opacity: .4; }

/* CTA */
.cta-card {
  background: linear-gradient(135deg, rgba(200,149,108,0.1), rgba(200,149,108,0.05));
  border: 1px solid rgba(200,149,108,0.2);
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  animation: fadeUp .5s .35s ease both;
  margin-bottom: 24px;
}
.cta-card h4 { font-family: 'Cairo', sans-serif; font-size: .95rem; font-weight: 800; margin-bottom: 6px; }
.cta-card p { font-size: .8rem; color: var(--text-muted); margin-bottom: 16px; }
.btn-wa {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  padding: 13px;
  background: rgba(37,211,102,0.12);
  border: 1px solid rgba(37,211,102,0.3);
  border-radius: 12px;
  color: #25D366;
  font-family: 'Cairo', sans-serif;
  font-size: .9rem; font-weight: 700;
  cursor: pointer; transition: all .2s;
  text-decoration: none;
}
.btn-wa:hover { background: rgba(37,211,102,0.2); }

.footer { text-align: center; font-size: .72rem; color: var(--text-faint); padding-bottom: 20px; }

/* Not found */
.not-found {
  text-align: center;
  padding: 60px 20px;
  animation: fadeUp .5s ease both;
}
.not-found i { font-size: 3rem; color: var(--text-faint); display: block; margin-bottom: 16px; opacity: .4; }
.not-found h3 { font-family: 'Cairo', sans-serif; font-size: 1.1rem; margin-bottom: 8px; }
.not-found p { font-size: .85rem; color: var(--text-muted); margin-bottom: 24px; }

@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-icon"><i class="fa-solid fa-spa"></i></div>
    <h1>Align by Enjy</h1>
    <p>رصيدي وسجل حضوري</p>
  </div>

  <div id="mainContent">
    <div class="loading">
      <div class="spinner"></div>
      <p>جاري تحميل بياناتك...</p>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7xZSiGqTh4ncnHcvFBx8ufwPudpEEl50",
  authDomain: "align-by-enjy.firebaseapp.com",
  databaseURL: "https://align-by-enjy-default-rtdb.firebaseio.com",
  projectId: "align-by-enjy",
  storageBucket: "align-by-enjy.firebasestorage.app",
  messagingSenderId: "355777857468",
  appId: "1:355777857468:web:20b15a19f526db02578db9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Get phone from URL
const urlParams = new URLSearchParams(window.location.search);
let phoneKey = urlParams.get('phone') || '';
phoneKey = phoneKey.replace(/[^0-9]/g, '');
if (phoneKey.length > 10) phoneKey = phoneKey.slice(-10);

if (!phoneKey) {
  renderNotFound();
} else {
  loadData(phoneKey);
}

async function loadData(key) {
  try {
    // Load credits
    const [credSnap, bookSnap, attSnap] = await Promise.all([
      get(ref(db, `credits/${key}`)),
      get(ref(db, 'bookings')),
      get(ref(db, 'attendance'))
    ]);

    const credits = credSnap.val();
    const bookings = bookSnap.val();
    const attendance = attSnap.val();

    // Find student name from bookings
    let studentName = null;
    let studentClasses = [];
    if (bookings) {
      const matches = Object.values(bookings).filter(b => {
        const raw = (b.phone || '').replace(/[^0-9]/g, '');
        const k = raw.length >= 10 ? raw.slice(-10) : raw;
        return k === key;
      });
      if (matches.length > 0) {
        const m = matches[0];
        studentName = `${m.fname} ${m.lname}`;
        const pMap = { power:'Power Yoga', diabetes:'Yoga for Diabetes', gentle:'Gentle Yoga', retreats:'الريتريتس' };
        studentClasses = [...new Set(matches.map(b => pMap[b.program] || b.program))];
      }
    }

    // Build attendance history
    let attendHistory = [];
    if (attendance) {
      Object.entries(attendance).forEach(([date, dayData]) => {
        if (dayData[key]) {
          attendHistory.push({ ...dayData[key], date });
        }
      });
      attendHistory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    }

    if (!credits && !studentName) {
      renderNotFound();
      return;
    }

    renderPage(key, studentName, credits, studentClasses, attendHistory);

  } catch(e) {
    console.error(e);
    renderNotFound();
  }
}

function renderPage(key, name, cr, classes, history) {
  const today = new Date().toISOString().slice(0, 10);
  const credits = cr ? Number(cr.credits) || 0 : 0;
  const expiry = cr?.expiry || null;
  const totalAttended = cr?.totalAttended || history.length || 0;

  const isExpired = expiry && expiry < today;
  const daysLeft = expiry ? Math.ceil((new Date(expiry) - new Date(today)) / (1000*60*60*24)) : null;

  const creditClass = credits === 0 ? 'danger' : credits <= 2 ? 'warn' : 'good';
  const iconClass = creditClass;

  // Avatar letter
  const initial = name ? name.charAt(0) : '؟';
  const phone = '+20' + key;

  let expiryWarningHTML = '';
  if (expiry) {
    if (isExpired) {
      expiryWarningHTML = `<div class="expiry-warning danger"><i class="fa-solid fa-circle-exclamation"></i><div>انتهت صلاحية حصصكِ بتاريخ <strong>${expiry}</strong>. تواصلي مع إنجي لتجديد الاشتراك.</div></div>`;
    } else if (daysLeft !== null && daysLeft <= 14) {
      expiryWarningHTML = `<div class="expiry-warning warn"><i class="fa-solid fa-triangle-exclamation"></i><div>ستنتهي صلاحية حصصكِ خلال <strong>${daysLeft} يوم</strong> بتاريخ ${expiry}. لا تنسي التجديد!</div></div>`;
    }
  }

  const historyHTML = history.length > 0
    ? history.slice(0, 15).map(h => `
        <div class="attend-row">
          <div class="ar-dot"></div>
          <div class="ar-info">
            <div class="ar-class">${h.className || 'كلاس'}</div>
            <div class="ar-date">${h.date || '—'}</div>
          </div>
          <div class="ar-time">${h.time || ''}</div>
        </div>`).join('')
    : `<div class="empty-history"><i class="fa-regular fa-calendar-xmark"></i>لا يوجد سجل حضور بعد</div>`;

  const classesHTML = classes.length > 0
    ? classes.map(c => `<span class="wc-class" style="margin-left:4px"><i class="fa-solid fa-circle" style="font-size:.4rem"></i>${c}</span>`).join('')
    : '<span class="wc-class"><i class="fa-solid fa-circle" style="font-size:.4rem"></i>غير محدد</span>';

  document.getElementById('mainContent').innerHTML = `
    <!-- Welcome -->
    <div class="welcome-card">
      <div class="wc-top">
        <div class="wc-avatar">${initial}</div>
        <div>
          <div class="wc-name">${name || 'مرحباً!'}</div>
          <div class="wc-phone" dir="ltr">${phone}</div>
        </div>
      </div>
      <div>${classesHTML}</div>
    </div>

    <!-- Credits hero -->
    <div class="credits-hero">
      <div class="ch-left">
        <div class="ch-label">الحصص المتبقية</div>
        <div class="ch-num ${creditClass}">${credits}</div>
        <div class="ch-sublabel">حصة متاحة</div>
      </div>
      <div class="ch-right">
        <div class="ch-circle ${iconClass}">
          <i class="fa-solid ${credits === 0 ? 'fa-ban' : credits <= 2 ? 'fa-triangle-exclamation' : 'fa-coins'}" style="font-size:1.6rem"></i>
        </div>
      </div>
    </div>

    <!-- Info grid -->
    <div class="info-grid">
      <div class="info-card">
        <div class="ic-icon" style="background:rgba(91,143,249,0.12);color:var(--blue)"><i class="fa-regular fa-calendar"></i></div>
        <div class="ic-label">انتهاء الصلاحية</div>
        <div class="ic-val ${isExpired ? 'danger' : daysLeft !== null && daysLeft <= 7 ? 'warn' : 'good'}">${expiry || '—'}</div>
      </div>
      <div class="info-card">
        <div class="ic-icon" style="background:rgba(76,175,125,0.12);color:var(--green)"><i class="fa-solid fa-user-check"></i></div>
        <div class="ic-label">إجمالي الحضور</div>
        <div class="ic-val good">${totalAttended} جلسة</div>
      </div>
    </div>

    ${expiryWarningHTML}

    <!-- History -->
    <div class="history-card">
      <div class="hc-head">
        <h3><i class="fa-solid fa-clock-rotate-left" style="color:var(--accent);margin-left:6px"></i>سجل الحضور</h3>
        <span class="hc-badge">${history.length} جلسة</span>
      </div>
      ${historyHTML}
    </div>

    <!-- CTA -->
    <div class="cta-card">
      <h4>محتاجة تجددي اشتراككِ؟</h4>
      <p>تواصلي مع إنجي على واتساب لتجديد حصصكِ أو لأي استفسار.</p>
      <a class="btn-wa" href="https://wa.me/201063751653" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> تواصلي مع إنجي
      </a>
    </div>

    <div class="footer">
      Align by Enjy © 2026 — Balance. Heal. Transform.
    </div>
  `;
}

function renderNotFound() {
  document.getElementById('mainContent').innerHTML = `
    <div class="not-found">
      <i class="fa-solid fa-user-slash"></i>
      <h3>الرقم غير موجود</h3>
      <p>لم نتمكن من العثور على بياناتكِ. تأكدي من الرابط أو تواصلي مع إنجي.</p>
      <a class="btn-wa" href="https://wa.me/201063751653" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;max-width:280px;margin:0 auto;padding:13px;background:rgba(37,211,102,0.12);border:1px solid rgba(37,211,102,0.3);border-radius:12px;color:#25D366;font-weight:700;text-decoration:none">
        <i class="fa-brands fa-whatsapp"></i> تواصلي مع إنجي
      </a>
    </div>
  `;
}
</script>
</body>
</html>
